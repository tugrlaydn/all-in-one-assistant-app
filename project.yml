# XcodeGen owns the project file (A03). Edit this, then `make gen`. Never hand-edit Persona.xcodeproj.
name: Persona
options:
  bundleIdPrefix: com.tugrlaydn # D1: the owner confirms the domain
  deploymentTarget:
    macOS: "26.0" # A02
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing until P9 brings the owner's Developer ID (A13).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  VaultKit:
    path: Packages/VaultKit
  DesignKit:
    path: Packages/DesignKit

targets:
  Persona:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: VaultKit
      - package: DesignKit
    settings:
      base:
        PRODUCT_NAME: Persona
        PRODUCT_MODULE_NAME: Persona
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 tugrlaydn"
      configs:
        # Debug is a different app to macOS (§8.6): own bundle id → own defaults, own sandbox
        # container, own bookmarks. It can never change what the owner's real build opens.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tugrlaydn.persona.debug
          INFOPLIST_KEY_CFBundleDisplayName: Persona Debug
          CODE_SIGN_ENTITLEMENTS: App/Resources/Persona-Debug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.tugrlaydn.persona
          INFOPLIST_KEY_CFBundleDisplayName: Persona
          CODE_SIGN_ENTITLEMENTS: App/Resources/Persona.entitlements
          # Release only: in Debug, library validation would stop the ad-hoc signed test bundle loading.
          ENABLE_HARDENED_RUNTIME: YES

  PersonaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: Persona
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tugrlaydn.persona.tests

schemes:
  Persona:
    build:
      targets:
        Persona: all
        PersonaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PersonaTests
    archive:
      config: Release
